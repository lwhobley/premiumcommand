name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
 Builds without any backend secrets. Real builds pass --dart-define values at deploy time.
      - name: Build web
        run: flutter build web- uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Builds without any backend secrets. Real builds pass --dart-define values at deploy time.
      - name: Build web
        run: flutter build web
