workflows:
  android-release:
    name: CUTX Premium Command - Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - cutx_supabase   # SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY (publishable key only)
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build Android app bundle
        script: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - principal@loungeability.app

  ios-release:
    name: CUTX Premium Command - iOS
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Venue Wrangler Wine
    environment:
      vars:
        BUNDLE_ID: "app.loungeability.cutxPremiumCommand"
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - cutx_supabase
        - cutx_ios_signing   # CERTIFICATE_PRIVATE_KEY: key matching the Apple Distribution certificate
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create App Store signing files
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing for the Xcode project
        script: xcode-project use-profiles
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build iOS
        script: |
          flutter build ipa --release \
            --export-method app-store \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # external beta review needs test info filled in App Store Connect
      email:
        recipients:
          - principal@loungeability.app
